[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-renamer"
version = "1.1.0"
description = "PDF-ek átnevezése: cikkek DOI/metaadat alapján, számlák és egyéb dokumentumok tartalom (és dátum) alapján"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0"]

[project.scripts]
pdfrenamer = "pdfrenamer.app:main_cli"        # parancssor (Linux/Windows/macOS), tkinter nem kell

[project.gui-scripts]
pdfrenamer-gui = "pdfrenamer.app:main_gui"    # grafikus felület (tkinter kell)

[tool.setuptools]
packages = ["pdfrenamer"]
